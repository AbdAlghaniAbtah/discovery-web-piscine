<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ex03</title>
</head>
    <body>
        <h1>Colors & Opacity</h1>

        <section class="color-palette">
            <h2>Named Colors</h2>

            <div class="color-swatch named-red">
                <p>red</p>
            </div>

            <div class="color-swatch named-blue">
                <p>blue</p>
            </div>

            <div class="color-swatch named-green">
                <p>green</p>
            </div>
        </section>
        <section class="color-palette">
    <h2>HEX Colors</h2>

    <div class="color-swatch hex-red">
        <p>#FF0000</p>
    </div>

    <div class="color-swatch hex-purple">
        <p>#800080</p>
    </div>

    <div class="color-swatch hex-orange">
        <p>#FFA500</p>
    </div>
</section>
<section class="color-palette">
    <h2>RGB Colors</h2>

    <div class="color-swatch rgb-blue">
        <p>rgb(0, 0, 255)</p>
    </div>

    <div class="color-swatch rgb-yellow">
        <p>rgb(255, 255, 0)</p>
    </div>

    <div class="color-swatch rgb-cyan">
        <p>rgb(0, 255, 255)</p>
    </div>
</section>
<section class="color-palette">
    <h2>RGBA Colors</h2>

    <div class="color-swatch rgba-red">
        <p>rgba(255, 0, 0, 0.5)</p>
    </div>

    <div class="color-swatch rgba-blue">
        <p>rgba(0, 0, 255, 0.5)</p>
    </div>
</section>
<section class="opacity-comparison">
    <h2>Opacity vs RGBA</h2>

    <div class="opacity-box">
        <p>Opacity: 0.5</p>
    </div>

    <div class="rgba-box">
        <p>RGBA Background</p>
    </div>
</section>
    </body>
</html>
