
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The Box Model</title>
</head>
<body>

    <h1>The CSS Box Model</h1>

    <section>
        <h2>Content-box</h2>
        <div class="content-box">
            <p>Content-box: width is for content only.</p>
        </div>
    </section>

    <section>
        <h2>Border-box</h2>
        <div class="border-box">
            <p>Border-box: width includes padding and border.</p>
        </div>
    </section>

</body>
</html>
